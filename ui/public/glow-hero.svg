<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="none">
  <defs>
    <!-- Bright concentrated spot at top center -->
    <radialGradient id="spot" cx="50%" cy="0%" r="35%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#ffaa28" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ff7800" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff5000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff5000" stop-opacity="0"/>
    </radialGradient>
    <!-- Wide ambient side glow -->
    <radialGradient id="ambient" cx="50%" cy="0%" r="70%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#ff8c00" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#c83c00" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#8c1e00" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="600" fill="url(#ambient)"/>
  <rect width="1440" height="600" fill="url(#spot)"/>
</svg>
