<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 500" preserveAspectRatio="none">
  <defs>
    <!-- Bright concentrated spot at top center -->
    <radialGradient id="spot" cx="50%" cy="0%" r="30%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#ffaa28" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#ff7800" stop-opacity="0.25"/>
      <stop offset="65%" stop-color="#ff5000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff5000" stop-opacity="0"/>
    </radialGradient>
    <!-- Wide ambient side glow -->
    <radialGradient id="ambient" cx="50%" cy="0%" r="65%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#ff8c00" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#c83c00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="500" fill="url(#ambient)"/>
  <rect width="1440" height="500" fill="url(#spot)"/>
</svg>
