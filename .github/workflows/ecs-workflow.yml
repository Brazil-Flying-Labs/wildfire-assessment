name: Deploy API to ECS (per-branch)

on:
  push:
    branches:
      - dev
    paths:
      - "api/**"
      - ".github/workflows/ecs-workflow.yml"
      - "polygons/**"
      - "requirements.txt"
      - ".env.template"
      - "Dockerfile"

env:
  AWS_ACCOUNT_ID: "055213706289"
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wildfire-assessment-${{ github.ref_name }}
  IMAGE_TAG: ${{ github.sha }}
  BRANCH: ${{ github.ref_name }}
  TASKDEF: .github/ecs/taskdef-${{ github.ref_name }}.json
  ENV: local
  SKIP_AWS_SECRETS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare env file
        run: cp .env.template .env

      - name: Build API image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wildfire-assessment-api:latest
          cache-from: type=gha,scope=test-api
          cache-to: type=gha,mode=max,scope=test-api

      - name: Set up Docker Compose services
        run: |
          docker compose up -d --no-build api db

      - name: Wait for services
        run: |
          sleep 10

      - name: Get docker logs
        run: docker compose logs api

      - name: Run backend tests inside container
        run: |
          docker compose exec -T api bash -lc "cd /api && coverage run --source=wildfire_assessment manage.py test && coverage report"

      - name: Tear down services
        if: always()
        run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions: { id-token: write, contents: read }

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug workspace
        run: |
          pwd
          git status --porcelain
          echo "--- tree (top)"; ls -la
          echo "--- svc"; ls -la svc || true
          echo "--- case check"
          git ls-files | grep -i '^svc/' || echo "No svc files tracked"

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.BRANCH }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=deploy-api
          cache-to: type=gha,mode=max,scope=deploy-api
      - name: Update ECS services
        run: |
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-api-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-celery-worker-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-celery-beat-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --services \
              wildfire-assessment-api-${{ env.BRANCH }} \
              wildfire-assessment-celery-worker-${{ env.BRANCH }} \
              wildfire-assessment-celery-beat-${{ env.BRANCH }} \
            --region ${{ env.AWS_REGION }}
