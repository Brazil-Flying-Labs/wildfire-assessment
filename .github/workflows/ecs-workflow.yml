name: Deploy API to ECS (per-branch)

on:
  push:
    branches:
      - dev
    paths:
      - "api/**"
      - ".github/workflows/ecs-workflow.yml"
      - "polygons/**"

env:
  AWS_ACCOUNT_ID: "055213706289"
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wildfire-assessment-${{ github.ref_name }}
  IMAGE_TAG: ${{ github.sha }}
  BRANCH: ${{ github.ref_name }}
  TASKDEF: .github/ecs/taskdef-${{ github.ref_name }}.json

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          source venv/bin/activate
          cd api
          coverage run --source=wildfire_assessment manage.py test
          coverage report

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions: { id-token: write, contents: read }

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Debug workspace
        run: |
          pwd
          git status --porcelain
          echo "--- tree (top)"; ls -la
          echo "--- svc"; ls -la svc || true
          echo "--- case check"
          git ls-files | grep -i '^svc/' || echo "No svc files tracked"

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.BRANCH }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-api-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-celery-worker-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-celery-beat-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
