name: Deploy API to ECS (per-branch)

on:
  push:
    branches:
      - dev
    paths:
      - "api/**"
      - ".github/workflows/ecs-workflow.yml"
      - "polygons/**"
      - "requirements.txt"
      - ".env.template"
      - "Dockerfile"

env:
  AWS_ACCOUNT_ID: "055213706289"
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wildfire-assessment-${{ github.ref_name }}
  IMAGE_TAG: ${{ github.sha }}
  BRANCH: ${{ github.ref_name }}
  TASKDEF: .github/ecs/taskdef-${{ github.ref_name }}.json
  ENV: local
  SKIP_AWS_SECRETS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare env file
        run: |
          cp .env.template .env
          echo "OTEL_SDK_DISABLED=true" >> .env

      - name: Build API image with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wildfire-api:dev
          cache-from: type=gha,scope=test-api
          cache-to: type=gha,mode=max,scope=test-api

      - name: Set up Docker Compose services
        run: |
          docker compose up -d --no-build api db

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U postgres && break
            sleep 1
          done

      - name: Get docker logs
        if: failure()
        run: docker compose logs api db

      - name: Run backend tests inside container
        run: |
          docker compose exec -T api bash -lc "cd /api && OTEL_SDK_DISABLED=true coverage run --source=wildfire_assessment manage.py test && coverage report"

      - name: Tear down services
        if: always()
        run: docker compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions: { id-token: write, contents: read }

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ env.BRANCH }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          cache-from: |
            type=gha,scope=test-api
            type=gha,scope=deploy-api
          cache-to: type=gha,mode=max,scope=deploy-api
      - name: Update ECS services
        run: |
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-api-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-celery-worker-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          aws ecs update-service \
            --cluster wildfire-assessment-${{ env.BRANCH }} \
            --service wildfire-assessment-celery-beat-${{ env.BRANCH }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for services to stabilize
        run: |
          CLUSTER="wildfire-assessment-${{ env.BRANCH }}"
          SERVICES=(
            "wildfire-assessment-api-${{ env.BRANCH }}"
            "wildfire-assessment-celery-worker-${{ env.BRANCH }}"
            "wildfire-assessment-celery-beat-${{ env.BRANCH }}"
          )
          MAX_ATTEMPTS=40
          INTERVAL=30
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            ALL_STABLE=true
            for SVC in "${SERVICES[@]}"; do
              ROLLOUT=$(aws ecs describe-services \
                --cluster "$CLUSTER" --services "$SVC" --region ${{ env.AWS_REGION }} \
                --query 'services[0].deployments[?status==`PRIMARY`].rolloutState' \
                --output text)
              echo "[$attempt/$MAX_ATTEMPTS] $SVC: $ROLLOUT"
              if [ "$ROLLOUT" = "FAILED" ]; then
                echo "::error::Service $SVC deployment FAILED"
                exit 1
              fi
              if [ "$ROLLOUT" != "COMPLETED" ]; then
                ALL_STABLE=false
              fi
            done
            if [ "$ALL_STABLE" = true ]; then
              echo "All services stable!"
              exit 0
            fi
            sleep $INTERVAL
          done
          echo "::error::Services did not stabilize within $((MAX_ATTEMPTS * INTERVAL))s"
          exit 1
