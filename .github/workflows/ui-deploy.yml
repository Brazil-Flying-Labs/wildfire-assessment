name: Deploy UI

on:
  push:
    branches:
      - dev
    paths:
      - "ui/**"
      - ".github/workflows/ui-deploy.yml"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"
      UI_DIRECTORY: ui
      S3_UI_BUCKET: wildfire-assessment-dev-ui
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.UI_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.UI_DIRECTORY }}
        run: npm ci

      - name: Build UI
        working-directory: ${{ env.UI_DIRECTORY }}
        env:
          REACT_APP_WILDLIFE_API_URL: ${{ secrets.REACT_APP_WILDLIFE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync build artifacts to S3
        run: aws s3 sync ${{ env.UI_DIRECTORY }}/build s3://${{ env.S3_UI_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths '/*'
