name: Deploy UI

on:
  push:
    branches:
      - dev
    paths:
      - "ui/**"
      - ".github/workflows/ui-deploy.yml"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"
      UI_DIRECTORY: ui
      S3_UI_BUCKET: wildfire-assessment-dev-ui
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      FARO_APP_ID: ${{ secrets.FARO_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.UI_DIRECTORY }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.UI_DIRECTORY }}
        run: npm ci

      - name: Extract environment variables
        run: |
          echo "REACT_APP_AUTH0_CLIENT_ID=${{ secrets.REACT_APP_AUTH0_CLIENT_ID }}" >> $GITHUB_ENV
          echo "REACT_APP_AUTH0_DOMAIN=${{ secrets.REACT_APP_AUTH0_DOMAIN }}" >> $GITHUB_ENV
          echo "REACT_APP_AUTH0_AUDIENCE=${{ secrets.REACT_APP_AUTH0_AUDIENCE }}" >> $GITHUB_ENV
          echo "REACT_APP_FARO_COLLECTOR_URL=${{ secrets.REACT_APP_FARO_COLLECTOR_URL }}" >> $GITHUB_ENV
          echo "REACT_APP_FARO_APP_NAME=wildfire-ui" >> $GITHUB_ENV
          echo "REACT_APP_APP_ENVIRONMENT=${{ github.ref_name }}" >> $GITHUB_ENV
          echo "REACT_APP_POSTHOG_KEY=${{ secrets.REACT_APP_POSTHOG_KEY }}" >> $GITHUB_ENV
          echo "REACT_APP_POSTHOG_HOST=${{ secrets.REACT_APP_POSTHOG_HOST }}" >> $GITHUB_ENV

      - name: Build UI
        working-directory: ${{ env.UI_DIRECTORY }}
        env:
          REACT_APP_WILDLIFE_API_URL: ${{ secrets.REACT_APP_WILDLIFE_API_URL }}
        run: npm run build

      - name: Inject Faro bundle ID into build
        if: env.FARO_APP_ID != ''
        working-directory: ${{ env.UI_DIRECTORY }}
        run: |
          npx faro-cli inject-bundle-id \
            --app-name "wildfire-ui" \
            --files "build/static/js/*.js" \
            --verbose

      - name: Upload source maps to Grafana Cloud
        if: env.FARO_APP_ID != ''
        continue-on-error: true
        working-directory: ${{ env.UI_DIRECTORY }}
        run: |
          npx faro-cli upload \
            --endpoint "${{ secrets.FARO_SOURCEMAP_ENDPOINT }}" \
            --app-id "${{ secrets.FARO_APP_ID }}" \
            --api-key "${{ secrets.FARO_API_KEY }}" \
            --stack-id "${{ secrets.FARO_STACK_ID }}" \
            --bundle-id env \
            --app-name "wildfire-ui" \
            --output-path "./build/static" \
            --recursive \
            --verbose

      - name: Remove source maps from build
        run: find ${{ env.UI_DIRECTORY }}/build -name '*.map' -delete

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync build artifacts to S3
        run: aws s3 sync ${{ env.UI_DIRECTORY }}/build s3://${{ env.S3_UI_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths '/*'
