# Production overrides. Always load explicitly:
#   docker compose -f compose.yml -f compose.prod.yml up -d
# (passing -f disables the implicit loading of compose.override.yml).
#
# No service publishes ports on the host: the existing Nginx Proxy
# Manager reaches api and ui by their Docker names on proxy_network.
#
# Memory limits measured on the VPS (2026-08-31, 7 gunicorn workers):
# api ~0.8 GiB idle (spikes during synchronous GEE analyses), celery
# ~0.25 GiB (spikes during GEE exports), postgres ~0.05 GiB, redis
# ~0.02 GiB, ui (nginx) minimal. Worst-case sum ~3.9 GiB — the VPS has
# ~5.9 GiB available with the other projects running (8 GiB swap as a
# safety net).

services:
  api:
    user: "10001"
    restart: unless-stopped
    mem_limit: 2g
    networks:
      - backend
      - proxy_network

  celery-worker:
    user: "10001"
    restart: unless-stopped
    mem_limit: 1g

  ui:
    build:
      context: .
      dockerfile: ui.Dockerfile
      args:
        REACT_APP_WILDLIFE_API_URL: ${REACT_APP_WILDLIFE_API_URL:-https://api-wildfire.droneai.com.br}
        REACT_APP_APP_ENVIRONMENT: ${REACT_APP_APP_ENVIRONMENT:-production}
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - backend
      - proxy_network

  postgres:
    restart: unless-stopped
    mem_limit: 512m

  redis:
    restart: unless-stopped
    mem_limit: 256m

networks:
  proxy_network:
    external: true
